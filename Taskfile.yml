version: '3'

env:
  # Unset VIRTUAL_ENV to avoid uv warnings when the shell has a stale environment activated
  VIRTUAL_ENV: ''

tasks:
  install:
    desc: Install dependencies
    cmds:
      - uv sync

  run:
    desc: Run the application
    cmds:
      - uv run subsync

  test:
    desc: Run tests (end-to-end tests excluded)
    cmds:
      - uv run pytest

  test:e2e:
    desc: Run the opt-in end-to-end tests (real Whisper tiny, FFmpeg and macOS say)
    cmds:
      - uv run pytest -m e2e

  lint:
    desc: Lint the code
    cmds:
      - uv run ruff check .

  format:
    desc: Format the code
    cmds:
      - uv run ruff format .
